# Keel account service on Fly.io: two small machines in one region.
# The region is a placeholder; pick the one closest to the Postgres instance.
app = "keel-account-service"
primary_region = "iad"
kill_timeout = 300 # let long agent streams finish on deploy

[build]

[deploy]
  release_command = "node dist/cli/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_ATTEST_MODE = "off" # set to "enforce" once App Attest lands (phase 2)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # streams can run for minutes
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
